<!doctype html><meta charset="utf-8">
<style>
  html{background:#141d26}
  html,body{margin:0;padding:0}
  body{width:1024px;height:500px;background:linear-gradient(135deg,#0d1116 0%,#16202a 100%);
       display:flex;align-items:center;gap:56px;padding:0 72px;box-sizing:border-box;
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
  .ring{flex:0 0 auto;width:150px;height:150px;border-radius:50%;border:16px solid #33D17A;
        display:flex;align-items:center;justify-content:center}
  .rupee{font-size:84px;font-weight:700;line-height:1;margin-top:-6px}
  h1{font-size:56px;margin:0 0 10px;letter-spacing:-1px}
  p{font-size:26px;margin:0;color:#B8C4CE;line-height:1.35}
  .card{margin-left:auto;flex:0 0 auto;background:#0b0e12;border:3px solid #33D17A;border-radius:18px;
        padding:20px 24px;min-width:220px}
  .verdict{color:#33D17A;font-size:20px;font-weight:700;letter-spacing:.5px}
  .rate{font-size:52px;font-weight:700;margin:2px 0 4px}
  .sub{color:#9AA7B2;font-size:19px}
</style>
<div class="ring"><div class="rupee">₹</div></div>
<div>
  <h1>RideScore</h1>
  <p style="white-space:nowrap">What an offer really pays,<br>per hour, after petrol.</p>
</div>
<div class="card">
  <div class="verdict">● ACCEPT</div>
  <div class="rate">₹184/hr</div>
  <div class="sub">₹38 · 3.7 km · 14 min</div>
</div>
