name: Build RideScore release bundle

# Produces the .aab that goes to Google Play. Run it by hand from the Actions
# tab when you are ready to upload a version.
#
# It signs the bundle only if the repository has the release keystore stored as
# secrets. Without them it still builds - unsigned - so the workflow is useful
# before the signing key exists.

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: "Version code (must be higher than the last uploaded to Play)"
        required: true
        default: "2"
      versionName:
        description: "Version name shown to users, e.g. 1.1"
        required: true
        default: "1.1"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest

    # GitHub does not allow a secret inside an `if:` expression, but it does
    # allow one in `env`, and env is allowed in `if`.
    env:
      HAS_KEYSTORE: ${{ secrets.RIDESCORE_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Restore the release keystore
        id: keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.RIDESCORE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Run the unit tests
        working-directory: ridescore
        run: ./gradlew :app:testReleaseUnitTest --no-daemon --stacktrace

      - name: Build the release bundle
        working-directory: ridescore
        env:
          RIDESCORE_KEYSTORE: ${{ steps.keystore.outputs.path }}
          RIDESCORE_KEYSTORE_PASSWORD: ${{ secrets.RIDESCORE_KEYSTORE_PASSWORD }}
          RIDESCORE_KEY_ALIAS: ${{ secrets.RIDESCORE_KEY_ALIAS }}
          RIDESCORE_KEY_PASSWORD: ${{ secrets.RIDESCORE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:bundleRelease --no-daemon --stacktrace \
            -PridescoreVersionCode=${{ inputs.versionCode }} \
            -PridescoreVersionName=${{ inputs.versionName }}

      # The bundle is an upload artifact, never a public release: a signed
      # bundle should not sit on a download page.
      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: ridescore-release-bundle
          path: ridescore/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
