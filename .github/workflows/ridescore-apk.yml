name: Build RideScore APK

# Builds the app on GitHub's machines and publishes the APK as a download,
# so a phone can install it without anyone setting up Android Studio.

on:
  push:
    branches:
      - "claude/ridescore-android-app-**"
    paths:
      - "ridescore/**"
      - ".github/workflows/ridescore-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('ridescore/gradle/libs.versions.toml', 'ridescore/**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run the unit tests
        working-directory: ridescore
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build the debug APK
        working-directory: ridescore
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ridescore-debug-apk
          path: ridescore/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload the test report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: ridescore/app/build/reports/tests/
          if-no-files-found: ignore

      # A release gives a direct .apk link that a phone browser can download
      # in one tap. A build artifact would arrive as a zip, which is awkward
      # to unpack on a phone.
      - name: Publish the APK as a downloadable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ridescore-latest --yes --cleanup-tag || true
          gh release create ridescore-latest \
            ridescore/app/build/outputs/apk/debug/app-debug.apk \
            --title "RideScore (latest debug build)" \
            --prerelease \
            --notes "Debug build of RideScore, built automatically from commit ${GITHUB_SHA:0:7}.

          Download **app-debug.apk** below on your Android phone and tap it to install.
          Android 8.0 or newer. You will need to allow installs from your browser once.

          After installing, open RideScore and grant the two permissions on the Home tab
          (Accessibility, and Draw over other apps), then press *Analyse the sample offer*
          to check it works."
